<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>任务脉络</title>
<style>:root{--blue:#526af4;--line:#dce4ef;--muted:#748197}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#243044;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:62px;padding:0 4%;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}main{max-width:1380px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(460px,1fr) 430px;gap:16px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.grow{flex:1}.muted{font-size:12px;color:var(--muted)}button,input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:7px;background:#fff}button{cursor:pointer}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{width:100%}textarea{min-height:62px}label{display:block;font-size:12px;font-weight:700;margin:11px 0 3px}.node{margin:7px 0 7px calc(var(--depth)*24px);padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}.node.selected{border-color:var(--blue);box-shadow:0 0 0 2px #edf0ff}.badge{font-size:11px;color:#76531c;background:#fff4df;border-radius:10px;padding:2px 6px}.proposal,.truth{background:#fff7e8;padding:9px;border-radius:8px;margin:9px 0}.hide{display:none}pre{white-space:pre-wrap;max-height:200px;overflow:auto;background:#f7f9fc;padding:8px;border-radius:7px}@media(max-width:850px){main{grid-template-columns:1fr;padding:10px}}.settings{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;font-weight:600}.actions{margin-top:12px}.proposal li{margin:12px 0}.proposal p{margin:4px 0}.truth{font-weight:600}h3{margin-top:0}.mobileBack{display:none;margin-bottom:12px}@media(max-width:850px){.mobileBack{display:inline-block}}</style>
<header><b>我的任务地图</b><span id="conn" class="muted">连接中…</span></header>
<main><section class="box"><div class="row"><input class="grow" id="ideaInput" placeholder="你想做什么？写在这里"><button id="planBtn" class="primary">帮我拆步骤</button><button id="undoBtn">撤销修改</button></div><p class="muted">写下想法，拆成几步。选中一步，就能修改或开始做。</p><div id="proposal" class="proposal hide"></div><div id="tree"></div></section><aside id="detail" class="box">正在打开…</aside></main>
<script>
let state, selected='idea', csrf='', models=[];
const $=q=>document.querySelector(q), node=id=>state.nodes.find(n=>n.id===id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function plainError(text){return String(text).replace(/已经有执行或回执未知/g,'上一轮还没确认结果').replace(/回执未知/g,'还没确认是否发出').replace(/节点/g,'这一步').replace(/派发/g,'交给 Codex').replace(/验收/g,'检查结果').replace(/返工/g,'修改').replace(/提案/g,'拆分结果').replace(/依赖/g,'前面要先完成的步骤').replace(/effort/g,'思考程度').replace(/turnId/g,'执行编号').replace(/revision/g,'版本')}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(plainError(j.error||'暂时连接不上，请重新打开工具'));return j}
function modelById(id){return models.find(m=>m.id===id)}
function effortNames(id){return (modelById(id)?.supportedReasoningEfforts||[]).map(e=>typeof e==='string'?e:e.reasoningEffort)}
const kinds={idea:'想法',execution:'要做的事',decision:'决定',evidence:'资料和结果'};
const modelNames={'gpt-5.6-luna':'Luna','gpt-5.6-terra':'Terra','gpt-5.6-sol':'Sol','gpt-6-astra':'Astra','gpt-5.5':'GPT-5.5','gpt-5.3-codex-spark':'Spark'};
const modelHints={'gpt-5.6-luna':'写文字、整理资料','gpt-5.6-terra':'做工具、处理视频','gpt-5.6-sol':'解决复杂问题','gpt-6-astra':'重要判断、困难问题'};
const effortLabels={low:'简单思考',medium:'标准',high:'仔细一点',xhigh:'深入分析',max:'更深入',ultra:'最深入'};
const modelName=id=>modelNames[id]||(id&&id!=='unknown'?id:'暂时查不到');
function statusCN(n){if(['tool','video'].includes(n.id))return '去原对话继续';if(['root','business','tests'].includes(n.id))return '分类';if(n.kind==='idea'&&!n.planningStatus)return '想法';const labels={ready:'还没开始',waiting_input:'等你补资料',sent:'正在交给 Codex',running:'Codex 正在做',pending_acceptance:'做好了，等你看',passed:'已完成',needs_rework:'需要修改',receipt_unknown:'还没确认是否发出，先别重复点',blocked_not_sent:'这个对话请到 Codex 里继续',failed:'没做成功',interrupted:'已停止'};const plans={sent:'正在拆步骤',running:'正在拆步骤',pending_proposal:'拆好了，等你看',ready:'拆好了，等你看',applied:'步骤已加入',completed:'步骤已拆好',receipt_unknown:'请先打开对话查看',blocked_not_sent:'请到 Codex 里继续'};return n.planningStatus&&['sent','running','pending_proposal','receipt_unknown','blocked_not_sent'].includes(n.planningStatus)?(plans[n.planningStatus]||'正在处理'):(labels[n.status]||'等待处理')}
function renderTree(){const out=$('#tree');out.innerHTML='';const seen=new Set();function add(id,depth){if(seen.has(id))return;seen.add(id);const n=node(id);if(!n)return;const el=document.createElement('div');el.className='node '+(id===selected?'selected':'');el.style.setProperty('--depth',depth);const toggle=(n.children||[]).length?`<button data-toggle="${esc(id)}">${n.collapsed?'＋':'−'}</button> `:'';el.innerHTML=toggle+`<b>${esc(n.title)}</b> ${n.locked?'🔒':''}${['root','business','tests'].includes(n.id)?'':'<br><span class="badge">'+esc(statusCN(n))+'</span>'}`;el.addEventListener('click',e=>{if(e.target.dataset.toggle){e.stopPropagation();toggleNode(n);return}selected=id;render();if(window.innerWidth<=850)$('#detail').scrollIntoView({behavior:'smooth',block:'start'})});out.append(el);if(!n.collapsed)(n.children||[]).forEach(c=>add(c,depth+1))}add('root',0);renderDetail()}
function render(){renderTree()}
function renderDetail(){
 const n=node(selected);if(!n)return;
 const busy=['sent','running','receipt_unknown','pending_acceptance','passed'].includes(n.status)||['sent','running','receipt_unknown'].includes(n.planningStatus);
 const editable=!n.locked&&!busy, requested=n.requested?.model?n.requested:n.suggested||{}, efforts=effortNames(requested.model);
 const canRun=n.kind==='execution'&&n.status==='ready'&&!['tool','video'].includes(n.id),canHuman=['decision','evidence'].includes(n.kind)&&!['sent','running','receipt_unknown','passed'].includes(n.status);
 $('#detail').innerHTML=`<button id="backToMap" class="mobileBack">← 返回任务地图</button><h3>${esc(n.title)}</h3><div class="truth">${esc(statusCN(n))}</div>
 <div class="row"><button id="open" ${n.threadId?'':'disabled'}>打开对话</button><button id="refresh" ${(n.turnId||n.planningTurnId)?'':'disabled'}>看看进度</button></div>
 <label for="title">这一步叫什么</label><input id="title" value="${esc(n.title)}" ${editable?'':'disabled'}>
 <label for="delivery">要做出什么</label><textarea id="delivery" ${editable?'':'disabled'}>${esc(n.delivery||'')}</textarea>
 <label for="acceptance">做到什么样才算好</label><textarea id="acceptance" ${editable?'':'disabled'}>${esc(n.acceptance||'')}</textarea>
 <details class="settings"><summary>选模型：${esc(modelName(requested.model))} · ${esc(effortLabels[requested.effort]||'未设置')}</summary>
 <label for="model">这一步让谁做</label><select id="model" ${editable?'':'disabled'}>${models.map(m=>`<option value="${esc(m.id)}" ${m.id===requested.model?'selected':''}>${esc(modelName(m.id))}${modelHints[m.id]?' · '+esc(modelHints[m.id]):''}</option>`).join('')}</select>
 <label for="effort">想得多深入</label><select id="effort" ${editable?'':'disabled'}>${efforts.map(e=>`<option value="${esc(e)}" ${e===requested.effort?'selected':''}>${esc(effortLabels[e]||e)}</option>`).join('')}</select>
 <p class="muted">简单的事先用 Luna。做工具或视频用 Terra；卡住了，再换更强的。</p></details>
 <div class="row actions"><button id="save" ${editable?'':'disabled'}>保存修改</button><button id="lock" ${busy?'disabled':''}>${n.locked?'允许修改':'先固定下来'}</button><button id="add" ${editable?'':'disabled'}>加一步</button></div>
 ${n.kind==='execution'&&!['tool','video'].includes(n.id)?`<label for="prompt">这次具体要做什么</label><textarea id="prompt" ${canRun?'':'disabled'} placeholder="例如：把这份资料整理成 3 个选题"></textarea><button id="run" class="primary actions" ${canRun?'':'disabled'}>让 Codex 做这步</button>`:''}
 <div id="evidenceBox" class="${(n.status==='pending_acceptance'||canHuman)?'':'hide'}"><label for="evidence">你看过后的意见</label><textarea id="evidence" placeholder="哪里做好了？哪里还要改？也可以写结果文件的位置。"></textarea><div class="row actions">${n.status==='pending_acceptance'?'<button id="pass" class="primary">做得可以</button><button id="return">需要修改</button>':''}${canHuman?'<button id="human" class="primary">我确认好了</button>':''}</div></div>
 ${n.result?'<label>做出来的结果</label><pre>'+esc(n.result)+'</pre>':''}
 <details class="settings muted"><summary>查看记录和用量</summary><p>建议模型：${esc(modelName(n.suggested?.model))}<br>这次选的：${esc(modelName(requested.model))}<br>实际运行记录：${esc(modelName(n.actual?.model))}<br>用量：${esc(typeof n.usage==='object'?JSON.stringify(n.usage):'暂时查不到')}<br>费用：暂时查不到，不估算金额</p><p>这张图已登记 ${esc(state.runsUsed)} / ${esc(state.limits?.maxRuns)} 次调用。手动改图不调用模型。</p><p>所在项目：${esc(n.project==='任务脉络本地执行器'?'我的任务地图':n.project||'未设置')}<br>对话编号：${esc(n.threadId||'需要时会新建对话')}</p></details>`;
 const model=$('#model');if(model)model.onchange=()=>{const ef=$('#effort');ef.innerHTML=effortNames(model.value).map(e=>`<option value="${esc(e)}">${esc(effortLabels[e]||e)}</option>`).join('')};
 bind('#backToMap',()=>$('main').scrollIntoView({behavior:'smooth',block:'start'}));bind('#save',saveEdit);bind('#lock',()=>edit({locked:!n.locked}));bind('#add',addChild);bind('#open',()=>location.href='codex://threads/'+n.threadId);bind('#refresh',refresh);bind('#run',execute);bind('#pass',()=>accept(true));bind('#return',()=>accept(false));bind('#human',humanConfirm)
}
function bind(q,f){const e=$(q);if(e)e.onclick=f}
async function reload(){state=await api('/api/state');render()}
async function edit(fields){const n=node(selected);try{await api('/api/node/edit',{nodeId:n.id,revision:n.revision,...fields});await reload()}catch(e){alert(e.message)}}
async function saveEdit(){await edit({title:$('#title').value,delivery:$('#delivery').value,acceptance:$('#acceptance').value,requested:{model:$('#model').value,effort:$('#effort').value}})}
async function toggleNode(n){try{await api('/api/node/edit',{nodeId:n.id,revision:n.revision,collapsed:!n.collapsed});await reload()}catch(e){alert(e.message)}}
async function addChild(){const title=prompt('新加的这一步叫什么？');if(!title)return;try{const n=await api('/api/node/add',{parentId:selected,title,kind:'idea'});selected=n.id;await reload()}catch(e){alert(e.message)}}
async function execute(){const n=node(selected);try{await api('/api/execute',{nodeId:n.id,revision:n.revision,prompt:$('#prompt').value});await reload()}catch(e){alert(e.message)}}
async function refresh(){try{const r=await api('/api/refresh',{nodeId:selected});await reload();if(r.proposal)showProposal(r.proposal)}catch(e){alert(e.message)}}
function showProposal(p){
 const box=$('#proposal');box.classList.remove('hide');
 box.innerHTML=`<b>建议这样做</b><ol>${(p.nodes||[]).map(n=>`<li><b>${esc(n.title)}</b><p>要做出：${esc(n.delivery||'你可以再补充')}</p><p>做好标准：${esc(n.acceptance||'你可以再补充')}</p><span class="muted">${esc(kinds[n.kind]||'步骤')} · 建议用 ${esc(modelName(n.suggested?.model))}</span></li>`).join('')}</ol>${p.assumptions?.length?`<details><summary>还有 ${p.assumptions.length} 件事没确定</summary><ul>${p.assumptions.map(a=>'<li>'+esc(a)+'</li>').join('')}</ul></details>`:''}<div class="row actions"><button id="apply" class="primary">把这些步骤加进去</button><button id="reject">先不用</button></div>`;
 $('#apply').onclick=async()=>{try{await api('/api/apply-proposal',{proposalId:p.proposalId});box.classList.add('hide');await reload()}catch(e){alert(e.message)}};$('#reject').onclick=()=>box.classList.add('hide')
}
async function accept(ok){const n=node(selected);try{await api(ok?'/api/accept':'/api/return',{nodeId:n.id,turnId:n.turnId,revision:n.revision,evidence:$('#evidence').value});await reload()}catch(e){alert(e.message)}}
async function humanConfirm(){try{await api('/api/human-confirm',{nodeId:selected,evidence:$('#evidence').value});await reload()}catch(e){alert(e.message)}}
$('#planBtn').onclick=async()=>{try{await api('/api/plan',{parentId:selected,idea:$('#ideaInput').value});await reload()}catch(e){alert(e.message)}};$('#undoBtn').onclick=async()=>{try{await api('/api/undo',{});await reload()}catch(e){alert(e.message)}};
(async()=>{csrf=(await api('/api/csrf')).token;const m=await api('/api/models');models=m.models||[];$('#conn').textContent=m.connected?'Codex 已连接':'Codex 未连接：'+(m.error||'未知');await reload()})().catch(e=>$('#conn').textContent=e.message);
</script></html>
